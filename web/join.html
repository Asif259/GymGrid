<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f0f4f9">
  <title>Join</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<main class="narrow">
  <header class="topbar">
    <h1 id="title">Join</h1>
    <div class="who"><span id="who"></span><button id="logout" class="quiet" hidden>Log out</button></div>
  </header>
  <div id="flash" class="msg" hidden role="status"></div>

  <section id="login" class="card" hidden>
    <div class="card-head"><h2>Sign up</h2></div>
    <p class="muted">Enter your email. We'll send a sign-in link, then you fill in your details.</p>
    <form id="login-form" class="login-form">
      <label>Email<input id="login-email" type="email" required autocomplete="email"></label>
      <button class="primary full-width">Email sign-in link</button>
    </form>
  </section>

  <section id="signup" class="card" hidden>
    <div class="card-head"><h2>Your details</h2></div>
    <form id="signup-form" class="form-stack">
      <label>Name<input name="name" required autocomplete="name"></label>
      <label>Phone (with country code)<input name="phone" required inputmode="tel" autocomplete="tel" placeholder="8801XXXXXXXXX"></label>
      <label>Plan<select name="plan_id" id="plan-select" required></select></label>
      <label>Goal<input name="goal"></label>
      <label>Age<input name="age" type="number" min="10" max="100"></label>
      <label>Sex<select name="sex"><option value="">-</option><option>male</option><option>female</option><option>other</option></select></label>
      <label>Height (cm)<input name="height_cm" type="number"></label>
      <label>Weight (kg)<input name="weight_kg" type="number" step="0.1"></label>
      <label>Injuries<input name="injuries"></label>
      <label>Diet preference<input name="diet_pref"></label>
      <button class="primary full-width">Join</button>
    </form>
  </section>
</main>
<script type="module" src="join.js"></script>
</body>
</html>
